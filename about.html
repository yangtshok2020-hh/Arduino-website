<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arduino Learning Hub</title>

<style>
body {
  margin: 0;
  font-family: "Poppins", sans-serif;
  background: #f9fafc;
  color: #333;
}

/* 🔹 Thin Top Banner (Logo + Navbar) */
.top-bar {
  background-color: #0A3D62; /* Dark Arduino Blue */
  color: white;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 40px;
}

.top-bar .logo {
  font-size: 1.5rem;
  font-weight: bold;
}

.top-bar .navbar {
  display: flex;
  gap: 20px;
}

.top-bar .navbar a {
  color: white;
  text-decoration: none;
  font-weight: bold;
  transition: 0.3s;
}

.top-bar .navbar a:hover {
  color: #00A896;
}

/* 🔹 Main Banner (Image + Title + Subtitle) */
.main-banner {
  background: url('https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1950&q=80') center/cover no-repeat;
  color: white;
  height: 300px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  position: relative;
}

.main-banner h1 {
  font-size: 2.5rem;
  margin: 0;
  font-weight: bold;
}

.main-banner p {
  margin-top: 10px;
  font-size: 1rem;
  max-width: 800px;
  line-height: 1.5;
  color: #D0F4F4;
}
