<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arduino Learning Hub</title>

<style>

body {
  margin: 0;
  background-color: #F4F4F4;
  font-family: Arial, sans-serif;
}

.top-banner {
  background-color: #0A3D62;
  color: white;
  padding: 20px 40px;
  position: relative;
  height: 180px;
  overflow: hidden;
}

.navbar {
  position: absolute;
  top: 20px;
  left: 30px;
}

.navbar a {
  color: white;
  text-decoration: none;
  margin-right: 15px;
  font-size: 1rem;
  font-weight: bold;
  transition: 0.3s;
}

.navbar a:not(:last-child)::after {
  content: " | ";
  color: #00A896;
}

.navbar a:hover {
  color: #00A896;
}

.top-banner h1 {
  font-size: 3rem;
  margin-top: 60px;
  text-align: center;
}

/* Button */
.start-btn {
  background-color: white;
  color: #00A896;
  border: none;
  padding: 15px 30px;
  border-radius: 8px;
  font-size: 1.1rem;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s ease;
  position: absolute;
  bottom: 30px;
  right: 40px;
}

.start-btn:hover {
  background-color: #00A896;
  color: white;
  transform: translateY(-3px);
}

/* Phone Frame */
.phone-frame {
  width: 360px;
  max-width: 90%;
  margin: 0 auto;
  padding: 30px 20px;
  background: linear-gradient(145deg, #072B45, #0A3D62);
  border-radius: 40px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.3);
  display: flex;
  justify-content: center;
  align-items: center;
}

.icon-grid {
  display: grid;
  grid-template-columns: repeat(2, 120px);
  grid-gap: 25px;
  justify-items: center;
}

.phone-icon {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-decoration: none;
  color: white;
  transform: translateY(50px) scale(0);
  animation: popIn 0.6s forwards;
  animation-delay: calc(var(--i) * 0.15s);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.phone-icon:hover {
  transform: scale(1.15) rotate(-3deg);
  box-shadow: 0 15px 25px rgba(0,0,0,0.35);
}

.phone-icon .icon {
  width: 80px;
  height: 80px;
  background: linear-gradient(135deg, #00A896, #00FFC8);
  border-radius: 25px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 2.5rem;
  margin-bottom: 12px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.25);
  animation: float 3s ease-in-out infinite;
}

.phone-icon .icon-label {
  text-align: center;
  font-weight: bold;
  font-size: 14px;
  color: white;
}

@keyframes popIn {
  0% { transform: translateY(50px) scale(0); opacity: 0; }
  60% { transform: translateY(-10px) scale(1.2); opacity: 1; }
  100% { transform: translateY(0) scale(1); opacity: 1; }
}

@keyframes float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-6px); }
  100% { transform: translateY(0px); }
}

/* Footer */
footer {
  background-color: #0A3D62;
  color: white;
  padding: 40px 0;
  display: flex;
  justify-content: space-around;
  flex-wrap: wrap;
}

.footer-section {
  flex: 1;
  min-width: 220px;
  margin: 10px;
  padding: 10px;
}

.footer-section h3 {
  color: #00A896;
  border-bottom: 2px solid #00A896;
  padding-bottom: 5px;
  margin-bottom: 15px;
}

.footer-section ul {
  list-style: none;
  padding: 0;
}

.footer-section ul li {
  margin: 8px 0;
}

.footer-section ul li a {
  color: #FFFFFF;
  text-decoration: none;
  transition: color 0.3s;
}

.footer-section ul li a:hover {
  color: #00A896;
}

.social-icons {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.social-icons a {
  color: white;
  font-size: 20px;
  transition: color 0.3s ease;
}

.social-icons a:hover {
  color: #00A896;
}

.footer-bottom {
  text-align: center;
  background-color: #072B45;
  color: #D0F4F4;
  padding: 15px;
  font-size: 14px;
}

</style>
