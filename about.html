<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arduino Learning Hub</title>

<style>
body {
  margin: 0;
  font-family: "Poppins", sans-serif;
  background: #f9fafc;
  color: #333;
}

/* 🔹 Thin Top Banner (Logo + Navbar) */
.top-bar {
  background-color: #0A3D62; /* Dark Arduino Blue */
  color: white;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 40px;
}

.top-bar .logo {
  font-size: 1.5rem;
  font-weight: bold;
}

.top-bar .navbar {
  display: flex;
  gap: 20px;
}

.top-bar .navbar a {
  color: white;
  text-decoration: none;
  font-weight: bold;
  transition: 0.3s;
}

.top-bar .navbar a:hover {
  color: #00A896;
}

/* 🔹 Main Banner (Image + Title + Subtitle) */
.main-banner {
  background: url('https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1950&q=80') center/cover no-repeat;
  color: white;
  height: 300px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  position: relative;
}

.main-banner h1 {
  font-size: 2.5rem;
  margin: 0;
  font-weight: bold;
}

.main-banner p {
  margin-top: 10px;
  font-size: 1rem;
  max-width: 800px;
  line-height: 1.5;
  color: #D0F4F4;
}

/* 🔹 Footer */
footer {
     background-color: #0A3D62; /* Dark Blue */
     color: white;
     padding: 40px 0;
     display: flex;
     justify-content: space-around;
     flex-wrap: wrap;
   }


   .footer-section {
     flex: 1;
     min-width: 220px;
     margin: 10px;
     padding: 10px;
   }


   .footer-section h3 {
     color: #00A896; /* Arduino Accent */
     border-bottom: 2px solid #00A896;
     padding-bottom: 5px;
     margin-bottom: 15px;
   }


   .footer-section ul {
     list-style: none;
     padding: 0;
   }


   .footer-section ul li {
     margin: 8px 0;
   }


   .footer-section ul li a {
     color: #FFFFFF;
     text-decoration: none;
     transition: color 0.3s;
   }


   .footer-section ul li a:hover {
     color: #00A896; /* Bright Cyan on Hover */
   }


   .social-icons {
     display: flex;
     gap: 10px;
     margin-top: 10px;
   }


   .social-icons a {
     color: white;
     font-size: 20px;
     text-decoration: none;
     transition: color 0.3s ease;
   }


   .social-icons a:hover {
     color: #00A896;
   }


   .footer-bottom {
     text-align: center;
     background-color: #072B45;
     color: #D0F4F4;
     padding: 15px;
     font-size: 14px;
   }
